# اجرای دستی واکشی آرشیو — از تب Actions با دکمه Run workflow
name: Fetch Archive

on:
  workflow_dispatch:
    inputs:
      source:
        description: "شناسه منبع (خالی = همه منابع)"
        required: false
        default: ""
      dry_run:
        description: "فقط گزارش، بدون دانلود"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-archive
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetcher (full logs, unbuffered)
        env:
          # کلید فشرده‌سازی apdf.io — از Secrets ریپو خوانده می‌شود
          # تنظیم: Settings ← Secrets and variables ← Actions ← New repository secret
          APDF_API_KEY: ${{ secrets.APDF_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="--source ${{ inputs.source }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -u fetch.py $ARGS

      - name: Commit and push new files (batched)
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry-run: کامیت انجام نمی‌شود."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          push_failed=0

          safe_push() {
            for i in 1 2 3 4 5; do
              if git push; then return 0; fi
              echo "پوش شکست خورد (تلاش $i از ۵) — ۳۰ ثانیه صبر و تلاش مجدد..."
              echo "--- کامیت‌های پوش‌نشده برای تشخیص: ---"
              git log --oneline "origin/main..HEAD" | head -5 || true
              sleep 30
            done
            echo "!!! پوش بعد از ۵ تلاش ناموفق بود."
            push_failed=1
            return 1
          }

          # ۱) کامیت منیفست و README — جدا و اول (پوش کوچک برای تست سلامت اتصال)
          git add data README.md
          if ! git diff --cached --quiet; then
            git commit -m "آرشیو: به‌روزرسانی منیفست و فهرست [skip ci]"
            safe_push
          fi

          # ۲) فایل‌های PDF در بسته‌های حداکثر ۱۵۰ مگابایت یا ۲۵ فایلی
          MAX_BATCH_BYTES=157286400
          total=0; n=0; batch=1
          while IFS= read -r -d '' entry; do
            f="${entry:3}"
            git add -- "$f"
            sz=$(stat -c%s -- "$f" 2>/dev/null || echo 0)
            total=$((total + sz)); n=$((n + 1))
            if [ "$total" -gt "$MAX_BATCH_BYTES" ] || [ "$n" -ge 25 ]; then
              if ! git diff --cached --quiet; then
                echo "--- بسته $batch: $n فایل، حدود $((total / 1048576))MB ---"
                git commit -m "آرشیو: افزودن $n فایل (بسته $batch) [skip ci]"
                safe_push
              fi
              total=0; n=0; batch=$((batch + 1))
            fi
          done < <(git status --porcelain=v1 -z -uall -- archive)

          # ۳) باقیمانده
          if ! git diff --cached --quiet; then
            git commit -m "آرشیو: افزودن $n فایل (بسته $batch) [skip ci]"
            safe_push
          fi

          if [ "$push_failed" -ne 0 ]; then
            echo "!!! برخی پوش‌ها شکست خوردند — اجرا قرمز می‌شود تا دیده شود."
            exit 1
          fi
          echo "تمام شد — همه تغییرات پوش شد."
