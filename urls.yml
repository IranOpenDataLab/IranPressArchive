# ============================================================
#  urls.yml — پیکربندی منابع آرشیو مطبوعات و اسناد ایران
# ============================================================
#  هر منبع یک آیتم در فهرست sources است با این کلیدها:
#
#    name       (الزامی) نام فارسی منبع — در فهرست README نمایش داده می‌شود
#    id         (الزامی) شناسه انگلیسی یکتا — نام زیرپوشه archive/<id>/ هم می‌شود
#    type       (الزامی) یکی از چهار نوع پشتیبانی‌شده:
#                 google_drive_folder : پوشه عمومی گوگل‌درایو
#                 google_drive_file   : فایل تکی گوگل‌درایو
#                 index_page          : صفحه فهرست لینک فایل‌ها (مثل Apache index)
#                 direct_files        : فهرست دستی URL مستقیم فایل‌ها
#    url        (الزامی برای سه نوع اول)
#    files      (الزامی برای direct_files) فهرست URLها
#
#  کلیدهای اختیاری:
#    date_regex : اگر الگوی تاریخ در نام فایل‌های این منبع خاص است،
#                 یک regex با سه گروه (سال، ماه، روز) بدهید؛ در غیر این
#                 صورت تشخیص خودکار (جلالی/میلادی، با جداکننده یا فشرده) انجام می‌شود.
#    extensions : (index_page) پسوندهای موردنظر؛ پیش‌فرض [".pdf"]
#    recursive  : (index_page) خزش در زیرپوشه‌ها؛ پیش‌فرض true
# ============================================================

sources:
  - name: توس
    id: tous
    type: google_drive_folder
    url: "https://drive.google.com/drive/folders/1N99McxPkLSsgsDB7OAf-30HunEcugi0u"

  - name: جامعه
    id: jameeh
    type: google_drive_folder
    url: "https://drive.google.com/drive/folders/1b8MVocgWUNt4Uq_Ar8goffCU--odoYfP"

  - name: عصر آزادگان
    id: asr-azadegan
    type: google_drive_folder
    url: "https://drive.google.com/drive/folders/1wLPrjrcSky_r3Ej5yYnAU4SfC6sLlNZg"

  - name: نشاط
    id: neshat
    type: index_page
    url: "https://jalaeipour.com/NESHAT/"
    extensions: [".pdf"]
    recursive: true

