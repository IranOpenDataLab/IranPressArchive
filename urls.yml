# ============================================================
#  urls.yml — پیکربندی منابع آرشیو مطبوعات و اسناد ایران
# ============================================================
#  هر منبع یک آیتم در فهرست sources است با این کلیدها:
#
#    name       (الزامی) نام فارسی منبع — در فهرست README نمایش داده می‌شود
#    id         (الزامی) شناسه انگلیسی یکتا — نام زیرپوشه archive/<id>/ هم می‌شود
#    type       (الزامی) یکی از پنج نوع پشتیبانی‌شده:
#                 google_drive_folder : پوشه عمومی گوگل‌درایو
#                 google_drive_file   : فایل تکی گوگل‌درایو
#                 index_page          : صفحه فهرست لینک فایل‌ها (مثل Apache index)
#                 url_sequence        : دنباله ترتیبی شماره‌ها (مثل نشاط)
#                 direct_files        : فهرست دستی URL مستقیم فایل‌ها
#    url        (الزامی برای انواع drive و index_page)
#
#  کلیدهای مشترک اختیاری:
#    max_file_mb      : سقف حجم هر فایل (پیش‌فرض ۹۰ مگابایت — هاردلیمیت گیت‌هاب ۱۰۰)
#    delay_seconds    : مکث بین دانلودها (پیش‌فرض ۱ ثانیه)
#    date_regex       : regex اختصاصی تاریخ با سه گروه (سال، ماه، روز)
#
#  کلیدهای url_sequence:
#    url_template     : الگوی URL با {year} و {issue}
#    filename_template: نام فایل ذخیره‌شده (پیش‌فرض: <id>_<year>_<issue>.pdf)
#    sequences        : فهرست بازه‌ها؛ هرکدام: year / start / end
#
#  کلیدهای index_page:
#    extensions       : پسوندها؛ پیش‌فرض [".pdf"]
#    recursive        : خزش در زیرپوشه‌ها؛ پیش‌فرض true
# ============================================================

sources:
  - name: توس
    id: tous
    type: google_drive_folder
    url: "https://drive.google.com/drive/folders/1N99McxPkLSsgsDB7OAf-30HunEcugi0u"

  - name: جامعه
    id: jameeh
    type: google_drive_folder
    url: "https://drive.google.com/drive/folders/1b8MVocgWUNt4Uq_Ar8goffCU--odoYfP"

  - name: عصر آزادگان
    id: asr-azadegan
    type: google_drive_folder
    url: "https://drive.google.com/drive/folders/1wLPrjrcSky_r3Ej5yYnAU4SfC6sLlNZg"

  - name: نشاط
    id: neshat
    type: url_sequence
    url_template: "https://jalaeipour.com/dl/neshat/{year}/{issue}.pdf"
    sequences:
      - year: 1377
        start: 1
        end: 24
      - year: 1378
        start: 25
        end: 148

